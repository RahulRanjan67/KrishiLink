{% extends "base.html" %}{% block content %}<div class="narrow"><p class="eyebrow">BUYER DEMAND</p><h1>What do you need to procure?</h1><p class="text-muted">A specific requirement helps the FPO find and aggregate the right supply.</p><div class="card shadow-sm mt-4"><div class="card-body p-4"><form method="post" action="{{ base_path }}/buyer/requirements"><div class="row g-3"><div class="col-md-6"><label class="form-label">Crop</label><select class="form-select" name="crop_id" required>{% for crop in crops %}<option value="{{ crop.id }}">{{ crop.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Quantity (Qtl)</label><input class="form-control" type="number" name="quantity" min="0.1" step="0.1" value="100" required></div><div class="col-md-6"><label class="form-label">Target price / Qtl</label><input class="form-control" type="number" name="target_price" min="1" value="4600" required></div><div class="col-md-6"><label class="form-label">Required grade</label><select class="form-select" name="required_grade"><option>A</option><option>B</option><option>C</option></select></div><div class="col-md-6"><label class="form-label">Maximum moisture %</label><input class="form-control" type="number" name="max_moisture" min="0" max="100" step="0.1" value="13" required></div><div class="col-md-6"><label class="form-label">Delivery district</label><input class="form-control" name="delivery_district" value="Nashik" required></div><div class="col-md-6"><label class="form-label">Deadline</label><input class="form-control" type="date" name="deadline" value="{{ today }}" required></div><div class="col-12"><label class="form-label">Notes (optional)</label><textarea class="form-control" name="notes" rows="3" placeholder="Any sorting, packaging or delivery notes"></textarea></div></div><button class="btn btn-primary mt-4">Save draft</button></form></div></div></div>{% endblock %}
