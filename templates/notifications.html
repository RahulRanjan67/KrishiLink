{% extends "base.html" %}{% block content %}<p class="eyebrow">IN-APP NOTIFICATIONS</p><h1>Updates that matter</h1><div class="card shadow-sm mt-4"><div class="card-body">{% for item in notifications %}<div class="list-link"><span>{{ item.message }}<small>{{ item.created_at }}</small></span><span class="status status-{{ item.type|lower }}">{{ item.type }}</span></div>{% else %}<div class="empty-panel">No notifications yet.</div>{% endfor %}</div></div>{% endblock %}
