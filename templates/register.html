{% extends "base.html" %}{% block content %}<div class="narrow"><p class="eyebrow">JOIN KRISHILINK</p><h1 class="mb-2">Create your workspace</h1><p class="text-muted mb-4">Farmers and buyers can register. FPO managers are provisioned by an administrator in this prototype.</p><div class="card shadow-sm"><div class="card-body p-4"><form method="post" action="{{ base_path }}/register"><label class="form-label">Full name</label><input class="form-control mb-3" name="full_name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required><label class="form-label">I am a</label><select class="form-select mb-3" name="role"><option value="FARMER">Farmer</option><option value="BUYER">Buyer</option></select><label class="form-label">Company name (buyers)</label><input class="form-control mb-3" name="company_name"><label class="form-label">District</label><input class="form-control mb-4" name="district" value="Nashik"><button class="btn btn-primary">Create account</button> <a class="btn btn-link" href="{{ base_path }}/login">Back to login</a></form></div></div></div>{% endblock %}
